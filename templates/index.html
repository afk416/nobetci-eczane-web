<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>En Yakın Nöbetçi Eczaneler — Nobetcim</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  :root {
    --bg: #f4f7fa;
    --card: #ffffff;
    --accent: #246b8f;
    --accent-dark: #1a536e;
    --text: #1f2d3a;
    --muted: #677889;
    --border: #e2e8ef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 540px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {
    margin: 0 0 12px;
    color: var(--accent);
    font-weight: 800;
    text-transform: uppercase;
    line-height: 1.05;
    letter-spacing: 0.4px;
    text-align: center;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .title-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
  }
  .title-line-1 { font-size: 36px; }
  .title-line-2 { font-size: 30px; margin-top: 6px; }
  header p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 480px) {
    .title-line-1 { font-size: 28px; }
    .title-line-2 { font-size: 22px; }
    .e-logo { width: 48px; height: 48px; font-size: 34px; }
    /* Butonları dikey yığ: ana buton tam genişlik, harita butonu kompakt */
    .btn-row { flex-direction: column; }
    .btn-map { align-self: center; padding: 10px 18px; }
  }
  @media (max-width: 360px) {
    .title-line-1 { font-size: 24px; }
    .title-line-2 { font-size: 19px; }
    .e-logo { width: 40px; height: 40px; font-size: 28px; }
  }

  /* Parlayan/sönen kırmızı E logosu (eczane tabelası tarzı) */
  .e-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 58px;
    height: 58px;
    background: #d32f2f;
    color: #fff;
    font-weight: 900;
    font-size: 42px;
    line-height: 1;
    letter-spacing: -1.5px;
    border-radius: 9px;
    /* Eczane tabelalarındaki klasik geometrik bold sans-serif */
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    animation: e-pulse 1.6s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7);
    /* Düz E için padding ayarı (alt baseline'a yakın olsun) */
    padding-bottom: 3px;
  }
  @keyframes e-pulse {
    0%, 100% {
      box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.75),
                  0 0 16px 3px rgba(211, 47, 47, 0.35);
      transform: scale(1);
    }
    50% {
      box-shadow: 0 0 0 18px rgba(211, 47, 47, 0),
                  0 0 32px 10px rgba(211, 47, 47, 0.55);
      transform: scale(1.06);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .e-logo { animation: none; }
    .result { animation: none; box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 0 10px 1px rgba(22,163,74,0.12); }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    margin-bottom: 16px;
  }
  button {
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    padding: 14px 16px;
    flex: 1;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { background: #9eb5c3; cursor: not-allowed; }

  /* Küçük harita butonu */
  .btn-map {
    background: #fff;
    color: var(--accent);
    border: 2px solid var(--accent);
    padding: 14px 14px;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .btn-map:hover { background: var(--accent); color: #fff; }
  .btn-map:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  .status {
    margin-top: 12px;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    min-height: 20px;
  }
  .status.error { color: #c23a3a; }

  /* En yakın eczane kartı: hafif yeşil zemin + nazik nabız gibi parlama */
  .result {
    background: linear-gradient(180deg, #e6f7ec 0%, #ffffff 70%);
    border-color: #b3e0c1;
    animation: nearestGlow 3.4s ease-in-out infinite;
  }
  @keyframes nearestGlow {
    0%, 100% { box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 0 0 0 rgba(22,163,74,0.06); }
    50%      { box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 0 14px 2px rgba(22,163,74,0.24); }
  }
  /* Mobilde en yakın kartı bir tık daha yeşil (temel kuraldan sonra ki kazansın) */
  @media (max-width: 480px) {
    .result { background: linear-gradient(180deg, #dcf4e4 0%, #ffffff 72%); border-color: #a3d9b4; }
  }

  .result h2 { margin: 0 0 6px; font-size: 18px; color: var(--accent); }
  .result .distance {
    display: inline-block;
    background: #e7f1f7;
    color: var(--accent-dark);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 8px 0;
    font-size: 14.5px;
    line-height: 1.45;
  }
  .row .ico { width: 20px; flex-shrink: 0; text-align: center; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .others h3 {
    font-size: 15px;
    margin: 0 0 10px;
    color: var(--muted);
    font-weight: 600;
  }
  .others ul { list-style: none; padding: 0; margin: 0; }
  .others li {
    padding: 8px 0;
    border-top: 1px solid var(--border);
    font-size: 14px;
  }
  .others li:first-child { border-top: none; }
  .others .name { font-weight: 600; }
  .others .meta { color: var(--muted); font-size: 13px; }
  .others .dist { color: #16a34a; font-size: 15px; font-weight: 700; }
  .others .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .others .act {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    text-decoration: none;
    color: var(--text);
    background: var(--card, transparent);
  }
  .others .act:active { opacity: .7; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 14px;
  }
  .hidden { display: none !important; }

  /* Harita */
  #mapCard { padding: 0; overflow: hidden; }
  #map {
    height: 540px;
    width: 100%;
    border-radius: 14px;
  }
  .maplibregl-popup-content {
    font-family: inherit;
    font-size: 14px;
    line-height: 1.45;
    min-width: 200px;
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .maplibregl-popup-content .pop-name {
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 4px;
    font-size: 15px;
  }
  .maplibregl-popup-content .pop-meta {
    color: var(--muted);
    font-size: 12.5px;
  }
  .maplibregl-popup-content a { color: var(--accent); font-weight: 600; }

  /* Geri dönüş butonu (harita modunda) */
  #backToList {
    margin-bottom: 12px;
    background: #fff;
    color: var(--accent);
    border: 2px solid var(--accent);
    padding: 12px 16px;
    width: 100%;
    font-size: 15px;
  }
  #backToList:hover { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>
      <span class="title-line title-line-1">
        <span class="e-logo" aria-hidden="true">E</span>
        <span>N YAKIN</span>
      </span>
      <span class="title-line title-line-2">NÖBETÇİ ECZANELER</span>
    </h1>
    <p>Konumunu paylaş, sana en yakın nöbetçi eczaneyi bulalım.</p>
  </header>

  <!-- ANA BUTON BÖLGESİ -->
  <div id="mainCard" class="card">
    <div class="btn-row">
      <button id="findBtn" class="btn-primary">📍 Bana En Yakın Nöbetçi Eczaneyi Bul</button>
      <button id="mapBtn" class="btn-map" title="Haritada Gör">🗺️ Haritada Gör</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <!-- HARİTA MODU -->
  <div id="mapView" class="hidden">
    <button id="backToList">← Listeye Dön</button>
    <div id="mapCard" class="card">
      <div id="map"></div>
    </div>
  </div>

  <!-- LİSTE MODU (varsayılan) -->
  <div id="listView">
    <div id="resultCard" class="card result hidden">
      <h2 id="pName"></h2>
      <span class="distance" id="pDistance"></span>
      <div class="row"><span class="ico">📍</span><span id="pAddress"></span></div>
      <div class="row"><span class="ico">📞</span><a id="pPhone" href="#"></a></div>
      <div class="row"><span class="ico">🗺️</span><a id="pMap" href="#" target="_blank" rel="noopener">Yol tarifi al</a></div>
    </div>

    <div id="othersCard" class="card others hidden">
      <h3>Diğer nöbetçi eczaneler</h3>
      <ul id="othersList"></ul>
    </div>
  </div>

  <footer>
    Veri kaynağı: TİTCK (e-Devlet) ve İl Eczacı Odaları ·
    <a href="/gizlilik">Gizlilik</a> ·
    <a href="/kullanim">Kullanım Şartları</a>
  </footer>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const findBtn = $("findBtn");
const mapBtn = $("mapBtn");
const backToList = $("backToList");
const statusEl = $("status");
const mainCard = $("mainCard");
const mapView = $("mapView");
const listView = $("listView");
const resultCard = $("resultCard");
const othersCard = $("othersCard");

const OFM_STYLE = "https://tiles.openfreemap.org/styles/liberty";  // ücretsiz, anahtarsız vektör harita
let _mapInstance = null;
let _markers = [];
let _lastGeo = null;
let _lastLoc = null;

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("error", isError);
}
const RADIUS_KM = 15;  // ilçe farketmeksizin bu yarıçaptaki tüm eczaneler
function toRad(d) { return d * Math.PI / 180; }
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function formatDist(km) {
  if (km < 1) return Math.round(km * 1000) + " m";
  return km.toFixed(2) + " km";
}
// Google Maps yol tarifi (kullanıcı konumundan eczaneye)
function dirUrl(p) {
  if (p && p.lat != null && p.lng != null) {
    return "https://www.google.com/maps/dir/?api=1&destination=" + p.lat + "," + p.lng;
  }
  return (p && p.harita) || "#";
}
function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

async function getPharmaciesForLocation(lat, lng) {
  const r = await fetch(`/api/pharmacies?lat=${lat}&lng=${lng}&_=${Date.now()}`, {
    cache: "no-store",
    headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" }
  });
  if (!r.ok) throw new Error("Eczane listesi alınamadı (HTTP " + r.status + ")");
  return await r.json();
}

function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("Tarayıcın konum özelliğini desteklemiyor."));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        _lastLoc = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        };
        resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      },
      (err) => {
        const messages = {
          1: "Konum izni reddedildi. Tarayıcı ayarlarından izin vermen gerekiyor.",
          2: "Konum alınamadı. GPS/internet bağlantını kontrol et.",
          3: "Konum alma zaman aşımına uğradı."
        };
        reject(new Error(messages[err.code] || "Konum hatası: " + err.message));
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

function renderResult(nearest, others) {
  $("pName").textContent = nearest.ad + (nearest.ilce ? " (" + nearest.ilce + ")" : "");
  $("pDistance").textContent = "📏 " + formatDist(nearest._km);
  $("pAddress").textContent = nearest.adres || "-";
  const phoneLink = $("pPhone");
  if (nearest.tel) {
    phoneLink.textContent = nearest.tel;
    phoneLink.href = "tel:" + nearest.tel;
  } else {
    phoneLink.textContent = "-";
    phoneLink.removeAttribute("href");
  }
  $("pMap").href = dirUrl(nearest);
  resultCard.classList.remove("hidden");

  const othersList = $("othersList");
  othersList.innerHTML = "";
  if (others.length) {
    others.forEach(p => {
      const li = document.createElement("li");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = p.ad + (p.ilce ? " (" + p.ilce + ")" : "");
      const meta = document.createElement("div");
      meta.className = "meta";
      const distSpan = document.createElement("span");
      distSpan.className = "dist";
      distSpan.textContent = formatDist(p._km);
      meta.appendChild(distSpan);
      meta.appendChild(document.createTextNode(" • " + (p.adres || "-")));

      const actions = document.createElement("div");
      actions.className = "actions";
      if (p.harita) {
        const mapA = document.createElement("a");
        mapA.className = "act";
        mapA.href = dirUrl(p);
        mapA.target = "_blank";
        mapA.rel = "noopener";
        mapA.innerHTML = "🗺️ <span>Yol tarifi al</span>";
        actions.appendChild(mapA);
      }
      if (p.tel) {
        const telA = document.createElement("a");
        telA.className = "act";
        telA.href = "tel:" + p.tel;
        telA.innerHTML = "📞 <span>" + p.tel + "</span>";
        actions.appendChild(telA);
      }
      li.appendChild(name);
      li.appendChild(meta);
      li.appendChild(actions);
      othersList.appendChild(li);
    });
    othersCard.classList.remove("hidden");
  } else {
    othersCard.classList.add("hidden");
  }
}

// ---- Harita ikon yardımcıları (MapLibre marker = DOM element) ----
function makePharmacyEl(isNearest) {
  const color = isNearest ? "#e8762a" : "#246b8f";
  const size = isNearest ? 38 : 30;
  const el = document.createElement("div");
  el.style.cursor = "pointer";
  el.innerHTML = `
    <svg width="${size}" height="${size}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 2C9 2 4 7 4 14c0 9 12 16 12 16s12-7 12-16c0-7-5-12-12-12z"
            fill="${color}" stroke="white" stroke-width="2"/>
      <circle cx="16" cy="13" r="6" fill="white"/>
      <path d="M13 13h6M16 10v6" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/>
    </svg>`;
  return el;
}
function makeUserEl() {
  const el = document.createElement("div");
  el.style.cssText =
    "width:18px;height:18px;background:#2563eb;border-radius:50%;" +
    "border:3px solid white;box-shadow:0 0 0 4px rgba(37,99,235,0.3);";
  return el;
}

function renderMap() {
  if (!_lastGeo || !_lastLoc) return;
  if (!_mapInstance) {
    _mapInstance = new maplibregl.Map({
      container: "map",
      style: OFM_STYLE,
      center: [_lastLoc.lng, _lastLoc.lat],
      zoom: 13,
      attributionControl: { compact: true },
    });
    _mapInstance.addControl(new maplibregl.NavigationControl(), "top-right");
    _mapInstance.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), "top-right");
  } else {
    _markers.forEach(m => m.remove());
  }
  _markers = [];

  const userMarker = new maplibregl.Marker({ element: makeUserEl(), anchor: "center" })
    .setLngLat([_lastLoc.lng, _lastLoc.lat])
    .setPopup(new maplibregl.Popup({ offset: 14 }).setHTML("📍 Buradasın"))
    .addTo(_mapInstance);
  _markers.push(userMarker);

  const bounds = new maplibregl.LngLatBounds();
  bounds.extend([_lastLoc.lng, _lastLoc.lat]);
  _lastGeo.forEach((p, i) => {
    const isNearest = i === 0;
    const phoneHtml = p.tel ? `📞 <a href="tel:${p.tel}">${p.tel}</a>` : "";
    const popupHtml = `
      <div class="pop-name">${isNearest ? "🟢 EN YAKIN — " : ""}${escapeHtml(p.ad)}</div>
      <div class="pop-meta">📏 ${formatDist(p._km)}</div>
      <div class="pop-meta">${escapeHtml(p.adres || "-")}</div>
      <div style="margin-top:6px;">${phoneHtml}</div>
      <div style="margin-top:4px;"><a href="${dirUrl(p)}" target="_blank" rel="noopener">🗺️ Yol tarifi al</a></div>
    `;
    const m = new maplibregl.Marker({ element: makePharmacyEl(isNearest), anchor: "bottom" })
      .setLngLat([p.lng, p.lat])
      .setPopup(new maplibregl.Popup({ offset: isNearest ? 34 : 26 }).setHTML(popupHtml))
      .addTo(_mapInstance);
    _markers.push(m);
    bounds.extend([p.lng, p.lat]);
  });

  _mapInstance.fitBounds(bounds, { padding: 40, maxZoom: 15, duration: 0 });
  setTimeout(() => _mapInstance.resize(), 120);
}

// ---- Ortak akış: konum + eczaneler ----
async function fetchAndRank() {
  const loc = await getLocation();
  setStatus("Bölgenizdeki nöbetçi eczaneler aranıyor...");
  const resp = await getPharmaciesForLocation(loc.lat, loc.lng);
  if (resp.error) throw new Error(resp.error);

  const pharmacies = resp.pharmacies || resp;

  const all = (pharmacies || []).filter(p => p.lat && p.lng);
  if (!all.length) {
    throw new Error("Bugün için koordinatlı nöbetçi eczane bulunamadı.");
  }
  all.forEach(p => { p._km = haversineKm(loc.lat, loc.lng, p.lat, p.lng); });
  all.sort((a, b) => a._km - b._km);

  // İlçe farketmeksizin 15 km yarıçapındaki tüm eczaneler.
  // 15 km içinde hiç yoksa en yakın 3'ü göster (boş ekran olmasın).
  const within = all.filter(p => p._km <= RADIUS_KM);
  const geo = within.length ? within : all.slice(0, 3);

  _lastGeo = geo;
  return { geo, withinRadius: within.length > 0, nearestKm: all[0]._km };
}

function showStatusMsg(withinRadius, nearestKm) {
  if (withinRadius) {
    setStatus(`📍 ${RADIUS_KM} km içindeki nöbetçi eczaneler (${_lastGeo.length})`);
  } else {
    setStatus(`⚠️ ${RADIUS_KM} km içinde nöbetçi eczane yok. En yakını ${nearestKm.toFixed(1)} km uzakta.`, true);
  }
}

// ---- LİSTE BUTONU ----
findBtn.addEventListener("click", async () => {
  findBtn.disabled = true;
  mapBtn.disabled = true;
  resultCard.classList.add("hidden");
  othersCard.classList.add("hidden");
  mapView.classList.add("hidden");
  listView.classList.remove("hidden");
  setStatus("Konum alınıyor...");
  try {
    const { geo, withinRadius, nearestKm } = await fetchAndRank();
    showStatusMsg(withinRadius, nearestKm);
    renderResult(geo[0], geo.slice(1));
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    findBtn.disabled = false;
    mapBtn.disabled = false;
  }
});

// ---- HARİTA BUTONU ----
mapBtn.addEventListener("click", async () => {
  findBtn.disabled = true;
  mapBtn.disabled = true;
  setStatus("Konum alınıyor...");
  try {
    const { geo, withinRadius, nearestKm } = await fetchAndRank();
    showStatusMsg(withinRadius, nearestKm);
    listView.classList.add("hidden");
    mapView.classList.remove("hidden");
    renderMap();
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    findBtn.disabled = false;
    mapBtn.disabled = false;
  }
});

// ---- LİSTEYE DÖN ----
backToList.addEventListener("click", () => {
  mapView.classList.add("hidden");
  listView.classList.remove("hidden");
  // Eğer önceden liste render edilmediyse render et
  if (_lastGeo && resultCard.classList.contains("hidden")) {
    renderResult(_lastGeo[0], _lastGeo.slice(1));
  }
});
</script>
</body>
</html>
