<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>En Yakın Nöbetçi Eczaneler — Nobetcim</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  :root {
    --bg: #f4f7fa;
    --card: #ffffff;
    --accent: #246b8f;
    --accent-dark: #1a536e;
    --text: #1f2d3a;
    --muted: #677889;
    --border: #e2e8ef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 540px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {
    margin: 0 0 12px;
    color: var(--accent);
    font-weight: 800;
    text-transform: uppercase;
    line-height: 1.05;
    letter-spacing: 0.4px;
    text-align: center;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .title-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    white-space: nowrap;
  }
  .title-line-1 { font-size: 37px; }
  .title-line-2 { font-size: 30px; margin-top: 6px; }
  header p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 480px) {
    .title-line-1 { font-size: 29px; }
    .title-line-2 { font-size: 22px; }
    .e-logo { width: 48px; height: 48px; font-size: 34px; }
    /* Telefonda da yan yana: yazıları küçült, taşmasın */
    /* Telefonda: iki satır metin + sol tarafta iki satır boyunda iğne */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 13.5px;
      padding: 12px 8px;
      line-height: 1.25;
      text-align: left;
    }
    .btn-primary .find-text { display: flex; flex-direction: column; }
    .btn-primary .fl { white-space: nowrap; }
    .btn-primary .pin { font-size: 1.85em; line-height: 1; margin-right: 0; }
    .btn-map { font-size: 13px; padding: 10px 12px; }
  }
  @media (max-width: 360px) {
    .title-line-1 { font-size: 25px; }
    .title-line-2 { font-size: 19px; }
    .e-logo { width: 40px; height: 40px; font-size: 28px; }
  }

  /* Parlayan/sönen kırmızı E logosu (eczane tabelası tarzı) */
  .e-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 58px;
    height: 58px;
    background: #d32f2f;
    color: #fff;
    font-weight: 900;
    font-size: 42px;
    line-height: 1;
    letter-spacing: 0;
    border-radius: 9px;
    /* Eczane tabelalarındaki klasik geometrik bold sans-serif */
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    animation: e-pulse 1.6s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7);
  }
  @keyframes e-pulse {
    0%, 100% {
      box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.75),
                  0 0 16px 3px rgba(211, 47, 47, 0.35);
      transform: scale(1);
    }
    50% {
      box-shadow: 0 0 0 18px rgba(211, 47, 47, 0),
                  0 0 32px 10px rgba(211, 47, 47, 0.55);
      transform: scale(1.06);
    }
  }
  /* Eczane ismi önündeki küçük E rozeti (tabela tarzı) */
  .e-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.55em;
    height: 1.55em;
    background: #d32f2f;
    color: #fff;
    font-weight: 900;
    font-size: 1.04em;
    line-height: 1;
    letter-spacing: 0;
    text-indent: 0;
    border-radius: 5px;
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    margin-right: 8px;
    vertical-align: -0.22em;
    flex: 0 0 auto;
  }
  @media (prefers-reduced-motion: reduce) {
    .e-logo { animation: none; }
    .map-e, .user-dot, .map-e-label.nearest { animation: none; }
    .user-ripple { display: none; }
    .result { animation: none; box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 0 10px 1px rgba(22,163,74,0.12); }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    margin-bottom: 16px;
  }
  button {
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    padding: 14px 16px;
    flex: 1;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { background: #9eb5c3; cursor: not-allowed; }
  .btn-primary .pin { margin-right: 5px; }

  /* Küçük harita butonu */
  .btn-map {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #fff;
    color: var(--accent);
    border: 2px solid var(--accent);
    padding: 14px 14px;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .map-ico { width: 20px; height: 20px; display: block; }
  .btn-map:hover { background: var(--accent); color: #fff; }
  .btn-map:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  .status {
    margin-top: 12px;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    min-height: 20px;
  }
  .status.error { color: #c23a3a; }

  /* En yakın eczane kartı: hafif yeşil zemin + nazik nabız gibi parlama */
  .result {
    background: rgba(22, 163, 74, 0.12);
    border-color: #5cbf80;
    animation: fadeIn 0.5s ease both, nearestGlow 3.4s ease-in-out infinite;
  }
  @keyframes nearestGlow {
    0%, 100% { box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 0 4px 0 rgba(22,163,74,0.14); }
    50%      { box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 0 18px 3px rgba(22,163,74,0.34); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* Diğer eczaneler kartı da görünürken yumuşakça belirir */
  .others { animation: fadeIn 0.5s ease both; }

  .result h2 { margin: 0 0 6px; font-size: 20px; color: var(--accent); display: flex; align-items: center; }
  .result .distance {
    display: inline-block;
    background: #e7f1f7;
    color: var(--accent-dark);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 8px 0;
    font-size: 14.5px;
    line-height: 1.45;
  }
  .row .ico { width: 20px; flex-shrink: 0; text-align: center; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  /* Tıklanabilir satır (telefon / yol tarifi) — ikon dahil hepsi link */
  .row-link { cursor: pointer; color: var(--accent); align-items: center; }
  .row-link:hover { text-decoration: none; }
  .row-link:active { opacity: .7; }
  .dir-ico { width: 18px; height: 18px; display: inline-block; vertical-align: middle; }
  .row .dir-text { font-size: 15.5px; font-weight: 700; }
  .others h3 {
    font-size: 15px;
    margin: 0 0 10px;
    color: var(--muted);
    font-weight: 600;
  }
  .others ul { list-style: none; padding: 0; margin: 0; }
  .others li {
    padding: 8px 0;
    border-top: 1px solid var(--border);
    font-size: 14px;
  }
  .others li:first-child { border-top: none; }
  .others .name { font-weight: 600; font-size: 16px; display: flex; align-items: center; }
  .others .meta { color: var(--muted); font-size: 13px; }
  .others .dist { color: #16a34a; font-size: 15px; font-weight: 700; }
  .others .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .others .act {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    text-decoration: none;
    color: var(--text);
    background: var(--card, transparent);
  }
  .others .act:active { opacity: .7; }
  /* Yol tarifi linki: 1 punto büyük + kalın, harita ikonlu */
  .others .act-dir { font-size: 14px; font-weight: 700; }
  .others .act .dir-ico { width: 16px; height: 16px; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 14px;
  }
  .hidden { display: none !important; }

  /* ---- Harita (tam ekran) ---- */
  #mapView {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #fff;
  }
  #map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 0;
  }
  /* Üstte solda "Ana Sayfa" butonu (yuvarlak hap, gölgeli) */
  #backToList {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 1001;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    width: auto;
    background: #fff;
    color: #18181b;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 9999px;
    padding: 10px 16px 10px 13px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }
  #backToList:hover { background: #f4f4f5; color: #18181b; }
  #backToList:active { transform: scale(0.97); }
  .back-ico { width: 18px; height: 18px; display: block; }

  /* Eczane marker'ı: yanıp sönen kırmızı E (ana sayfadaki logoyla aynı).
     ÖNEMLİ: animasyon (transform: scale) İÇ öğede; dış sarmalayıcıyı MapLibre
     transform: translate ile konumlandırır — ikisi aynı öğede olursa çakışır. */
  .map-e-wrap { cursor: pointer; line-height: 0; }
  .map-e-wrap.nearest { z-index: 3; }
  /* E logosunun altındaki eczane adı etiketi (ayrı marker) */
  .map-e-label {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(255,255,255,0.95);
    color: #1f2d3a;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: 0.2px;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,0.28);
    border: 1px solid rgba(0,0,0,0.06);
    pointer-events: none;
  }
  .map-e-label.nearest {
    font-size: 13px;
    color: #15803d;
    animation: labelGlow 1.6s ease-in-out infinite;
  }
  @keyframes labelGlow {
    0%, 100% { text-shadow: 0 0 2px rgba(21,128,61,0.45); }
    50%      { text-shadow: 0 0 8px rgba(34,197,94,0.95), 0 0 14px rgba(21,128,61,0.7); }
  }
  .map-e {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: #d32f2f;
    color: #fff;
    font-weight: 900;
    font-size: 19px;
    line-height: 1;
    border-radius: 7px;
    border: 2px solid #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    box-shadow: 0 0 0 0 rgba(211,47,47,0.7), 0 2px 6px rgba(0,0,0,0.35);
    animation: e-pulse 1.6s ease-in-out infinite;
  }
  .map-e-wrap.nearest .map-e {
    width: 44px;
    height: 44px;
    font-size: 27px;
    border-radius: 9px;
  }

  /* Kullanıcı konumu: mavi nokta + genişleyen halka */
  .user-loc { position: relative; width: 18px; height: 18px; }
  .user-dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 16px; height: 16px;
    background: #2563eb;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    transform: translate(-50%,-50%);
    animation: location-pulse 2s ease-in-out infinite;
    z-index: 2;
  }
  .user-ripple {
    position: absolute;
    top: 50%; left: 50%;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(37,99,235,0.4);
    transform: translate(-50%,-50%);
    animation: location-ripple 2s ease-out infinite;
  }
  .user-ripple.delayed { animation-delay: 1s; }
  @keyframes location-pulse {
    0%, 100% { transform: translate(-50%,-50%) scale(1); }
    50%      { transform: translate(-50%,-50%) scale(1.15); }
  }
  @keyframes location-ripple {
    0%   { transform: translate(-50%,-50%) scale(0.3); opacity: 0.85; }
    100% { transform: translate(-50%,-50%) scale(3);   opacity: 0; }
  }

  .maplibregl-popup-content {
    font-family: inherit;
    font-size: 14px;
    line-height: 1.45;
    min-width: 200px;
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .maplibregl-popup-content .pop-name {
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 4px;
    font-size: 15px;
  }
  .maplibregl-popup-content .pop-meta {
    color: var(--muted);
    font-size: 12.5px;
  }
  .maplibregl-popup-content a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>
      <span class="title-line title-line-1">
        <span class="e-logo" aria-hidden="true">E</span>
        <span>N YAKIN</span>
      </span>
      <span class="title-line title-line-2">NÖBETÇİ ECZANELER</span>
    </h1>
    <p>Konumunu paylaş, sana en yakın nöbetçi eczaneyi bulalım.</p>
  </header>

  <!-- ANA BUTON BÖLGESİ -->
  <div id="mainCard" class="card">
    <div class="btn-row">
      <button id="findBtn" class="btn-primary"><span class="pin">📍</span><span class="find-text"><span class="fl">Bana En Yakın</span> <span class="fl">Nöbetçi Eczaneyi Bul</span></span></button>
      <button id="mapBtn" class="btn-map" title="Haritada Gör">
        <svg class="map-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/>
          <line x1="8" y1="3" x2="8" y2="18"/>
          <line x1="16" y1="6" x2="16" y2="21"/>
        </svg>
        <span>Harita</span>
      </button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <!-- HARİTA MODU (tam ekran) -->
  <div id="mapView" class="hidden">
    <button id="backToList" aria-label="Ana sayfaya dön">
      <svg class="back-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
      </svg>
      <span>Ana Sayfa</span>
    </button>
    <div id="map"></div>
  </div>

  <!-- LİSTE MODU (varsayılan) -->
  <div id="listView">
    <div id="resultCard" class="card result hidden">
      <h2 id="pName"></h2>
      <span class="distance" id="pDistance"></span>
      <div class="row"><span class="ico">📍</span><span id="pAddress"></span></div>
      <a class="row row-link" id="pPhone"><span class="ico">📞</span><span class="row-txt" id="pPhoneTxt"></span></a>
      <a class="row row-link" id="pMap" target="_blank" rel="noopener"><span class="ico"><svg class="dir-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/><line x1="8" y1="3" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="21"/></svg></span><span class="row-txt dir-text">Yol tarifi al</span></a>
    </div>

    <div id="othersCard" class="card others hidden">
      <h3>Diğer nöbetçi eczaneler</h3>
      <ul id="othersList"></ul>
    </div>
  </div>

  <footer>
    Veri kaynağı: TİTCK (e-Devlet) ve İl Eczacı Odaları ·
    <a href="/gizlilik">Gizlilik</a> ·
    <a href="/kullanim">Kullanım Şartları</a>
  </footer>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const findBtn = $("findBtn");
const mapBtn = $("mapBtn");
const backToList = $("backToList");
const statusEl = $("status");
const mainCard = $("mainCard");
const mapView = $("mapView");
const listView = $("listView");
const resultCard = $("resultCard");
const othersCard = $("othersCard");

const OFM_STYLE = "https://tiles.openfreemap.org/styles/liberty";  // ücretsiz, anahtarsız vektör harita
// Harita butonundaki ile aynı "harita" ikonu (yol tarifi linklerinde kullanılır)
const MAP_ICO = '<svg class="dir-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/><line x1="8" y1="3" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="21"/></svg>';
let _mapInstance = null;
let _markers = [];
let _lastGeo = null;
let _lastLoc = null;

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("error", isError);
}
const RADIUS_KM = 30;  // ilçe farketmeksizin bu yarıçaptaki tüm eczaneler
function toRad(d) { return d * Math.PI / 180; }
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function formatDist(km) {
  if (km < 1) return Math.round(km * 1000) + " m";
  return km.toFixed(2) + " km";
}
// Google Maps yol tarifi (kullanıcı konumundan eczaneye)
function dirUrl(p) {
  // Ham koordinata gidince Google iğneyi tam o noktaya koyuyor; kaynak pin
  // birkaç metre kayıksa yan binaya düşüyor. Bunun yerine ad + adres ile
  // arat: Google kayıtlı eczane işletmesine "snap"ler (doğru pin). Ad/adres
  // yoksa koordinata düş.
  const ad = (p && p.ad) ? pharmacyName(p.ad) : "";
  const adres = (p && p.adres) || "";
  const q = [ad, adres].filter(Boolean).join(" ").trim();
  if (q) {
    return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(q);
  }
  if (p && p.lat != null && p.lng != null) {
    return "https://www.google.com/maps/dir/?api=1&destination=" + p.lat + "," + p.lng;
  }
  return (p && p.harita) || "#";
}
function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Eczane ismi: kaynak veride çoğu zaman sadece "MURAT" gibi gelir; sonuna "Eczanesi" ekle
function pharmacyName(ad) {
  const s = String(ad || "").trim();
  if (!s) return "Eczane";
  return /eczane/i.test(s) ? s : s + " ECZANESİ";
}

async function getPharmaciesForLocation(lat, lng) {
  const r = await fetch(`/api/pharmacies?lat=${lat}&lng=${lng}&_=${Date.now()}`, {
    cache: "no-store",
    headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" }
  });
  if (!r.ok) throw new Error("Eczane listesi alınamadı (HTTP " + r.status + ")");
  return await r.json();
}

function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("Tarayıcın konum özelliğini desteklemiyor."));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        _lastLoc = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        };
        resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      },
      (err) => {
        const messages = {
          1: "Konum izni reddedildi. Tarayıcı ayarlarından izin vermen gerekiyor.",
          2: "Konum alınamadı. GPS/internet bağlantını kontrol et.",
          3: "Konum alma zaman aşımına uğradı."
        };
        reject(new Error(messages[err.code] || "Konum hatası: " + err.message));
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

function renderResult(nearest, others) {
  $("pName").innerHTML = '<span class="e-badge">E</span>' + escapeHtml(pharmacyName(nearest.ad) + (nearest.ilce ? " (" + nearest.ilce + ")" : ""));
  $("pDistance").textContent = "📏 " + formatDist(nearest._km);
  $("pAddress").textContent = nearest.adres || "-";
  const phoneLink = $("pPhone");
  if (nearest.tel) {
    $("pPhoneTxt").textContent = nearest.tel;
    phoneLink.href = "tel:" + nearest.tel;
  } else {
    $("pPhoneTxt").textContent = "-";
    phoneLink.removeAttribute("href");
  }
  $("pMap").href = dirUrl(nearest);
  resultCard.classList.remove("hidden");

  const othersList = $("othersList");
  othersList.innerHTML = "";
  if (others.length) {
    others.forEach(p => {
      const li = document.createElement("li");
      const name = document.createElement("div");
      name.className = "name";
      name.innerHTML = '<span class="e-badge">E</span>' + escapeHtml(pharmacyName(p.ad) + (p.ilce ? " (" + p.ilce + ")" : ""));
      const meta = document.createElement("div");
      meta.className = "meta";
      const distSpan = document.createElement("span");
      distSpan.className = "dist";
      distSpan.textContent = formatDist(p._km);
      meta.appendChild(distSpan);
      meta.appendChild(document.createTextNode(" • " + (p.adres || "-")));

      const actions = document.createElement("div");
      actions.className = "actions";
      if (p.harita) {
        const mapA = document.createElement("a");
        mapA.className = "act act-dir";
        mapA.href = dirUrl(p);
        mapA.target = "_blank";
        mapA.rel = "noopener";
        mapA.innerHTML = MAP_ICO + "<span>Yol tarifi al</span>";
        actions.appendChild(mapA);
      }
      if (p.tel) {
        const telA = document.createElement("a");
        telA.className = "act";
        telA.href = "tel:" + p.tel;
        telA.innerHTML = "📞 <span>" + p.tel + "</span>";
        actions.appendChild(telA);
      }
      li.appendChild(name);
      li.appendChild(meta);
      li.appendChild(actions);
      othersList.appendChild(li);
    });
    othersCard.classList.remove("hidden");
  } else {
    othersCard.classList.add("hidden");
  }
}

// ---- Harita ikon yardımcıları (MapLibre marker = DOM element) ----
function makePharmacyEl(isNearest) {
  const el = document.createElement("div");
  el.className = "map-e-wrap" + (isNearest ? " nearest" : "");
  const inner = document.createElement("div");
  inner.className = "map-e";
  inner.textContent = "E";
  el.appendChild(inner);
  return el;
}
// Eczane adı etiketi (ayrı marker; E'nin konumunu etkilemesin diye)
function makeLabelEl(isNearest, name) {
  const el = document.createElement("div");
  el.className = "map-e-label" + (isNearest ? " nearest" : "");
  el.textContent = name;
  return el;
}
function makeUserEl() {
  const el = document.createElement("div");
  el.className = "user-loc";
  el.innerHTML =
    '<span class="user-ripple"></span>' +
    '<span class="user-ripple delayed"></span>' +
    '<span class="user-dot"></span>';
  return el;
}

// Marker'ları yerleştirir ve görünümü kullanıcı + en yakın eczaneye odaklar.
// Harita boyutu/stili hazır olduktan SONRA çağrılmalı (yoksa marker'lar 0,0'a düşer).
function placeMapMarkers() {
  _markers.forEach(m => m.remove());
  _markers = [];

  const userMarker = new maplibregl.Marker({ element: makeUserEl(), anchor: "center" })
    .setLngLat([_lastLoc.lng, _lastLoc.lat])
    .setPopup(new maplibregl.Popup({ offset: 14 }).setHTML("📍 Buradasın"))
    .addTo(_mapInstance);
  _markers.push(userMarker);

  _lastGeo.forEach((p, i) => {
    const isNearest = i === 0;
    const phoneHtml = p.tel ? `📞 <a href="tel:${p.tel}">${p.tel}</a>` : "";
    const popupHtml = `
      <div class="pop-name">${isNearest ? "🟢 EN YAKIN — " : ""}<span class="e-badge">E</span>${escapeHtml(pharmacyName(p.ad))}</div>
      <div class="pop-meta">📏 ${formatDist(p._km)}</div>
      <div class="pop-meta">${escapeHtml(p.adres || "-")}</div>
      <div style="margin-top:6px;">${phoneHtml}</div>
      <div style="margin-top:4px;"><a href="${dirUrl(p)}" target="_blank" rel="noopener">🗺️ Yol tarifi al</a></div>
    `;
    const m = new maplibregl.Marker({ element: makePharmacyEl(isNearest), anchor: "center" })
      .setLngLat([p.lng, p.lat])
      .setPopup(new maplibregl.Popup({ offset: isNearest ? 26 : 20 }).setHTML(popupHtml))
      .addTo(_mapInstance);
    _markers.push(m);

    // Eczane adı etiketi: aynı koordinata ayrı marker, E'nin hemen altında
    const labelMarker = new maplibregl.Marker({
      element: makeLabelEl(isNearest, pharmacyName(p.ad)),
      anchor: "top",
      offset: [0, isNearest ? 25 : 19],
    }).setLngLat([p.lng, p.lat]).addTo(_mapInstance);
    _markers.push(labelMarker);
  });

  // Yakın açılış: tüm 30 km'yi değil, kullanıcı + en yakın eczaneyi sığdır.
  const focus = new maplibregl.LngLatBounds();
  focus.extend([_lastLoc.lng, _lastLoc.lat]);
  focus.extend([_lastGeo[0].lng, _lastGeo[0].lat]);
  _mapInstance.fitBounds(focus, { padding: 110, maxZoom: 16, duration: 0 });
}

function renderMap() {
  if (!_lastGeo || !_lastLoc) return;
  if (!_mapInstance) {
    _mapInstance = new maplibregl.Map({
      container: "map",
      style: OFM_STYLE,
      center: [_lastLoc.lng, _lastLoc.lat],
      zoom: 14,
      attributionControl: { compact: true },
    });
    _mapInstance.addControl(new maplibregl.NavigationControl(), "top-right");
    _mapInstance.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), "top-right");
    // İlk açılışta stil + boyut hazır olunca marker'ları yerleştir
    _mapInstance.on("load", () => {
      _mapInstance.resize();
      placeMapMarkers();
    });
  } else {
    _mapInstance.resize();
    placeMapMarkers();
  }
}

// ---- Ortak akış: konum + eczaneler ----
async function fetchAndRank() {
  const loc = await getLocation();
  setStatus("Bölgenizdeki nöbetçi eczaneler aranıyor...");
  const resp = await getPharmaciesForLocation(loc.lat, loc.lng);
  if (resp.error) throw new Error(resp.error);

  const pharmacies = resp.pharmacies || resp;

  const all = (pharmacies || []).filter(p => p.lat && p.lng);
  if (!all.length) {
    throw new Error("Bugün için koordinatlı nöbetçi eczane bulunamadı.");
  }
  all.forEach(p => { p._km = haversineKm(loc.lat, loc.lng, p.lat, p.lng); });
  all.sort((a, b) => a._km - b._km);

  // İlçe farketmeksizin 15 km yarıçapındaki tüm eczaneler.
  // 15 km içinde hiç yoksa en yakın 3'ü göster (boş ekran olmasın).
  const within = all.filter(p => p._km <= RADIUS_KM);
  const geo = within.length ? within : all.slice(0, 3);

  _lastGeo = geo;
  return { geo, withinRadius: within.length > 0, nearestKm: all[0]._km };
}

function showStatusMsg(withinRadius, nearestKm) {
  if (withinRadius) {
    setStatus(`📍 ${RADIUS_KM} km içindeki nöbetçi eczaneler (${_lastGeo.length})`);
  } else {
    setStatus(`⚠️ ${RADIUS_KM} km içinde nöbetçi eczane yok. En yakını ${nearestKm.toFixed(1)} km uzakta.`, true);
  }
}

// ---- LİSTE BUTONU ----
findBtn.addEventListener("click", async () => {
  findBtn.disabled = true;
  mapBtn.disabled = true;
  resultCard.classList.add("hidden");
  othersCard.classList.add("hidden");
  mapView.classList.add("hidden");
  listView.classList.remove("hidden");
  setStatus("Konum alınıyor...");
  try {
    const { geo, withinRadius, nearestKm } = await fetchAndRank();
    showStatusMsg(withinRadius, nearestKm);
    renderResult(geo[0], geo.slice(1));
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    findBtn.disabled = false;
    mapBtn.disabled = false;
  }
});

// ---- HARİTA BUTONU ----
mapBtn.addEventListener("click", async () => {
  findBtn.disabled = true;
  mapBtn.disabled = true;
  setStatus("Konum alınıyor...");
  try {
    const { geo, withinRadius, nearestKm } = await fetchAndRank();
    showStatusMsg(withinRadius, nearestKm);
    listView.classList.add("hidden");
    mapView.classList.remove("hidden");
    document.body.style.overflow = "hidden";
    // Geçmişe bir adım ekle ki telefonun geri tuşu siteden çıkmasın, haritayı kapatsın
    if (!(history.state && history.state.nbMap)) {
      history.pushState({ nbMap: 1 }, "");
    }
    renderMap();
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    findBtn.disabled = false;
    mapBtn.disabled = false;
  }
});

// ---- LİSTEYE DÖN ----
// Haritayı kapatıp ana sayfaya (liste görünümüne) dön
function closeMap() {
  document.body.style.overflow = "";
  mapView.classList.add("hidden");
  listView.classList.remove("hidden");
  // Eğer önceden liste render edilmediyse render et
  if (_lastGeo && resultCard.classList.contains("hidden")) {
    renderResult(_lastGeo[0], _lastGeo.slice(1));
  }
  window.scrollTo(0, 0);
}

// Telefonun geri tuşu: siteden çıkma, haritayı kapat (ana sayfaya dön)
window.addEventListener("popstate", () => {
  if (!mapView.classList.contains("hidden")) {
    closeMap();
  }
});

backToList.addEventListener("click", () => {
  // Harita açılırken eklenen geçmiş adımını geri al -> popstate -> closeMap
  if (history.state && history.state.nbMap) {
    history.back();
  } else {
    closeMap();
  }
});
</script>
