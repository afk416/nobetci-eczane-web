<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>En Yakın Nöbetçi Eczaneler — Nobetcim</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  :root {
    --bg: #f4f7fa;
    --card: #ffffff;
    --accent: #246b8f;
    --accent-dark: #1a536e;
    --text: #1f2d3a;
    --muted: #677889;
    --border: #e2e8ef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 540px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {
    margin: 0 0 10px;
    font-size: 32px;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-wrap: wrap;
    letter-spacing: 0.5px;
    font-weight: 800;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .logo-text {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 480px) {
    header h1 { font-size: 24px; gap: 6px; }
  }

  /* Parlayan/sönen kırmızı E logosu (eczane tabelası tarzı) */
  .e-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 76px;
    height: 76px;
    background: #d32f2f;
    color: #fff;
    font-weight: 900;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -2px;
    border-radius: 10px;
    /* Eczane tabelalarındaki klasik geometrik bold sans-serif */
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    animation: e-pulse 1.6s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7);
    /* Düz E için padding ayarı (alt baseline'a yakın olsun) */
    padding-bottom: 4px;
  }
  @keyframes e-pulse {
    0%, 100% {
      box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.75),
                  0 0 16px 3px rgba(211, 47, 47, 0.35);
      transform: scale(1);
    }
    50% {
      box-shadow: 0 0 0 18px rgba(211, 47, 47, 0),
                  0 0 32px 10px rgba(211, 47, 47, 0.55);
      transform: scale(1.06);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .e-logo { animation: none; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    margin-bottom: 16px;
  }
  button {
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    padding: 14px 16px;
    flex: 1;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { background: #9eb5c3; cursor: not-allowed; }

  /* Küçük harita butonu */
  .btn-map {
    background: #fff;
    color: var(--accent);
    border: 2px solid var(--accent);
    padding: 14px 14px;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .btn-map:hover { background: var(--accent); color: #fff; }
  .btn-map:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  .status {
    margin-top: 12px;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    min-height: 20px;
  }
  .status.error { color: #c23a3a; }

  .result h2 { margin: 0 0 6px; font-size: 18px; color: var(--accent); }
  .result .distance {
    display: inline-block;
    background: #e7f1f7;
    color: var(--accent-dark);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 8px 0;
    font-size: 14.5px;
    line-height: 1.45;
  }
  .row .ico { width: 20px; flex-shrink: 0; text-align: center; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .others h3 {
    font-size: 15px;
    margin: 0 0 10px;
    color: var(--muted);
    font-weight: 600;
  }
  .others ul { list-style: none; padding: 0; margin: 0; }
  .others li {
    padding: 8px 0;
    border-top: 1px solid var(--border);
    font-size: 14px;
  }
  .others li:first-child { border-top: none; }
  .others .name { font-weight: 600; }
  .others .meta { color: var(--muted); font-size: 13px; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 14px;
  }
  .hidden { display: none !important; }

  /* Harita */
  #mapCard { padding: 0; overflow: hidden; }
  #map {
    height: 540px;
    width: 100%;
    border-radius: 14px;
  }
  .leaflet-popup-content {
    font-family: inherit;
    font-size: 14px;
    line-height: 1.45;
    min-width: 200px;
  }
  .leaflet-popup-content .pop-name {
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 4px;
    font-size: 15px;
  }
  .leaflet-popup-content .pop-meta {
    color: var(--muted);
    font-size: 12.5px;
  }
  .leaflet-popup-content a { color: var(--accent); font-weight: 600; }

  /* Geri dönüş butonu (harita modunda) */
  #backToList {
    margin-bottom: 12px;
    background: #fff;
    color: var(--accent);
    border: 2px solid var(--accent);
    padding: 12px 16px;
    width: 100%;
    font-size: 15px;
  }
  #backToList:hover { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>
      <span class="e-logo" aria-hidden="true">E</span><span class="logo-text">N YAKIN NÖBETÇİ ECZANELER</span>
    </h1>
    <p>Konumunu paylaş, sana en yakın nöbetçi eczaneyi bulalım.</p>
  </header>

  <!-- ANA BUTON BÖLGESİ -->
  <div id="mainCard" class="card">
    <div class="btn-row">
      <button id="findBtn" class="btn-primary">📍 Bana en yakın nöbetçi eczaneyi bul</button>
      <button id="mapBtn" class="btn-map" title="Haritada gör">🗺️ Haritada gör</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <!-- HARİTA MODU -->
  <div id="mapView" class="hidden">
    <button id="backToList">← Listeye dön</button>
    <div id="mapCard" class="card">
      <div id="map"></div>
    </div>
  </div>

  <!-- LİSTE MODU (varsayılan) -->
  <div id="listView">
    <div id="resultCard" class="card result hidden">
      <h2 id="pName"></h2>
      <span class="distance" id="pDistance"></span>
      <div class="row"><span class="ico">📍</span><span id="pAddress"></span></div>
      <div class="row"><span class="ico">📞</span><a id="pPhone" href="#"></a></div>
      <div class="row"><span class="ico">🗺️</span><a id="pMap" href="#" target="_blank" rel="noopener">Google Maps'te aç</a></div>
    </div>

    <div id="othersCard" class="card others hidden">
      <h3>Diğer nöbetçi eczaneler</h3>
      <ul id="othersList"></ul>
    </div>
  </div>

  <footer>
    Veri kaynağı: CollectAPI ·
    <a href="/gizlilik">Gizlilik</a> ·
    <a href="/kullanim">Kullanım Şartları</a>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $ = (id) => document.getElementById(id);
const findBtn = $("findBtn");
const mapBtn = $("mapBtn");
const backToList = $("backToList");
const statusEl = $("status");
const mainCard = $("mainCard");
const mapView = $("mapView");
const listView = $("listView");
const resultCard = $("resultCard");
const othersCard = $("othersCard");

let _mapInstance = null;
let _lastGeo = null;
let _lastLoc = null;

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("error", isError);
}
function toRad(d) { return d * Math.PI / 180; }
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function formatDist(km) {
  if (km < 1) return Math.round(km * 1000) + " m";
  return km.toFixed(2) + " km";
}
function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

async function getPharmaciesForLocation(lat, lng) {
  const r = await fetch(`/api/pharmacies?lat=${lat}&lng=${lng}&_=${Date.now()}`, {
    cache: "no-store",
    headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" }
  });
  if (!r.ok) throw new Error("Eczane listesi alınamadı (HTTP " + r.status + ")");
  return await r.json();
}

function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("Tarayıcın konum özelliğini desteklemiyor."));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        _lastLoc = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        };
        resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      },
      (err) => {
        const messages = {
          1: "Konum izni reddedildi. Tarayıcı ayarlarından izin vermen gerekiyor.",
          2: "Konum alınamadı. GPS/internet bağlantını kontrol et.",
          3: "Konum alma zaman aşımına uğradı."
        };
        reject(new Error(messages[err.code] || "Konum hatası: " + err.message));
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

function renderResult(nearest, others) {
  $("pName").textContent = nearest.ad + (nearest.ilce ? " (" + nearest.ilce + ")" : "");
  $("pDistance").textContent = "📏 " + formatDist(nearest._km);
  $("pAddress").textContent = nearest.adres || "-";
  const phoneLink = $("pPhone");
  if (nearest.tel) {
    phoneLink.textContent = nearest.tel;
    phoneLink.href = "tel:" + nearest.tel;
  } else {
    phoneLink.textContent = "-";
    phoneLink.removeAttribute("href");
  }
  $("pMap").href = nearest.harita || "#";
  resultCard.classList.remove("hidden");

  const othersList = $("othersList");
  othersList.innerHTML = "";
  if (others.length) {
    others.forEach(p => {
      const li = document.createElement("li");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = p.ad + (p.ilce ? " (" + p.ilce + ")" : "");
      const meta = document.createElement("div");
      meta.className = "meta";
      const mapA = document.createElement("a");
      mapA.href = p.harita;
      mapA.target = "_blank";
      mapA.rel = "noopener";
      mapA.textContent = "harita";
      meta.textContent = formatDist(p._km) + " • " + (p.adres || "-") + " • ";
      meta.appendChild(mapA);
      li.appendChild(name);
      li.appendChild(meta);
      othersList.appendChild(li);
    });
    othersCard.classList.remove("hidden");
  } else {
    othersCard.classList.add("hidden");
  }
}

// ---- Harita ikon yardımcıları ----
function makePharmacyIcon(isNearest) {
  const color = isNearest ? "#e8762a" : "#246b8f";
  const size = isNearest ? 38 : 30;
  const svg = `
    <svg width="${size}" height="${size}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 2C9 2 4 7 4 14c0 9 12 16 12 16s12-7 12-16c0-7-5-12-12-12z"
            fill="${color}" stroke="white" stroke-width="2"/>
      <circle cx="16" cy="13" r="6" fill="white"/>
      <path d="M13 13h6M16 10v6" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/>
    </svg>`;
  return L.divIcon({ className:"", html: svg, iconSize:[size,size], iconAnchor:[size/2,size] });
}
function makeUserIcon() {
  const html = `<div style="
    width:18px;height:18px;background:#2563eb;border-radius:50%;
    border:3px solid white;box-shadow:0 0 0 4px rgba(37,99,235,0.3);"></div>`;
  return L.divIcon({ className:"", html, iconSize:[18,18], iconAnchor:[9,9] });
}

function renderMap() {
  if (!_lastGeo || !_lastLoc) return;
  if (!_mapInstance) {
    _mapInstance = L.map("map", { scrollWheelZoom: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19,
    }).addTo(_mapInstance);
  } else {
    _mapInstance.eachLayer(l => {
      if (l instanceof L.Marker) _mapInstance.removeLayer(l);
    });
  }

  L.marker([_lastLoc.lat, _lastLoc.lng], { icon: makeUserIcon(), zIndexOffset: 1000 })
    .addTo(_mapInstance)
    .bindPopup("📍 Buradasın");

  const bounds = [[_lastLoc.lat, _lastLoc.lng]];
  _lastGeo.forEach((p, i) => {
    const isNearest = i === 0;
    const phoneHtml = p.tel ? `📞 <a href="tel:${p.tel}">${p.tel}</a>` : "";
    const popupHtml = `
      <div class="pop-name">${isNearest ? "🟢 EN YAKIN — " : ""}${escapeHtml(p.ad)}</div>
      <div class="pop-meta">📏 ${formatDist(p._km)}</div>
      <div class="pop-meta">${escapeHtml(p.adres || "-")}</div>
      <div style="margin-top:6px;">${phoneHtml}</div>
      <div style="margin-top:4px;"><a href="${p.harita}" target="_blank" rel="noopener">🗺️ Yol tarifi</a></div>
    `;
    L.marker([p.lat, p.lng], { icon: makePharmacyIcon(isNearest), zIndexOffset: isNearest ? 500 : 0 })
      .addTo(_mapInstance)
      .bindPopup(popupHtml);
    bounds.push([p.lat, p.lng]);
  });

  _mapInstance.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
  setTimeout(() => _mapInstance.invalidateSize(), 100);
}

// ---- Ortak akış: konum + eczaneler ----
async function fetchAndRank() {
  const loc = await getLocation();
  setStatus("Bölgenizdeki nöbetçi eczaneler aranıyor...");
  const resp = await getPharmaciesForLocation(loc.lat, loc.lng);
  if (resp.error) throw new Error(resp.error);

  const pharmacies = resp.pharmacies || resp;
  const fallback = resp.fallback === true;
  const districtName = resp.user_district_display;

  const geo = (pharmacies || []).filter(p => p.lat && p.lng);
  if (!geo.length) {
    throw new Error("Bugün için koordinatlı nöbetçi eczane bulunamadı.");
  }
  geo.forEach(p => { p._km = haversineKm(loc.lat, loc.lng, p.lat, p.lng); });
  geo.sort((a, b) => a._km - b._km);

  _lastGeo = geo;
  return { geo, fallback, districtName };
}

function showStatusMsg(fallback, districtName) {
  if (fallback) {
    setStatus(districtName
      ? `⚠️ ${districtName} bölgesinde bugün nöbetçi eczane yok. Tüm il listesini gösteriyorum.`
      : "⚠️ Bulunduğun ilçe tespit edilemedi. Tüm il listesini gösteriyorum.", true);
  } else if (districtName) {
    setStatus(`📍 ${districtName} bölgesi`);
  } else {
    setStatus("");
  }
}

// ---- LİSTE BUTONU ----
findBtn.addEventListener("click", async () => {
  findBtn.disabled = true;
  mapBtn.disabled = true;
  resultCard.classList.add("hidden");
  othersCard.classList.add("hidden");
  mapView.classList.add("hidden");
  listView.classList.remove("hidden");
  setStatus("Konum alınıyor...");
  try {
    const { geo, fallback, districtName } = await fetchAndRank();
    showStatusMsg(fallback, districtName);
    renderResult(geo[0], geo.slice(1));
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    findBtn.disabled = false;
    mapBtn.disabled = false;
  }
});

// ---- HARİTA BUTONU ----
mapBtn.addEventListener("click", async () => {
  findBtn.disabled = true;
  mapBtn.disabled = true;
  setStatus("Konum alınıyor...");
  try {
    const { geo, fallback, districtName } = await fetchAndRank();
    showStatusMsg(fallback, districtName);
    listView.classList.add("hidden");
    mapView.classList.remove("hidden");
    renderMap();
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    findBtn.disabled = false;
    mapBtn.disabled = false;
  }
});

// ---- LİSTEYE DÖN ----
backToList.addEventListener("click", () => {
  mapView.classList.add("hidden");
  listView.classList.remove("hidden");
  // Eğer önceden liste render edilmediyse render et
  if (_lastGeo && resultCard.classList.contains("hidden")) {
    renderResult(_lastGeo[0], _lastGeo.slice(1));
  }
});
</script>
</body>
</html>
